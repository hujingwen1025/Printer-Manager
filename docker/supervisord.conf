[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:cups]
command=/usr/sbin/cupsd -f -c /etc/cups/cupsd.conf
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/gunicorn printer_manager.wsgi:application --bind 0.0.0.0:%(ENV_PM_PORT)s --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
directory=/app
user=printermanager
umask=077
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/python manage.py runworker
directory=/app
user=printermanager
umask=077
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
